<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hair length map</title>
<style>
:root{--bg:#eceef1;--panel:#fff;--ink:#1d2430;--mute:#68707d;--line:#d5d9df;
--uniform:#3a7ca5;--undercut:#d1495b;--mullet:#e0992b;--hybrid:#4f8a4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 12px 0 0}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--uniform);outline-offset:2px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sp{flex:1}
#stat{color:var(--mute);font-size:13px}
main{padding:18px;max-width:1300px;margin:0 auto}
.empty{text-align:center;padding:80px 20px;color:var(--mute)}
.empty button{margin:6px}
/* rate */
.rate{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:800px){.rate{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:300px}
.stage img{max-width:100%;max-height:74vh;object-fit:contain;border-radius:6px}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{margin-bottom:14px;padding:8px;border-radius:8px;border:2px solid transparent}
.row.act{border-color:var(--ink)}
.row b{display:block;margin-bottom:6px}
.opts{display:flex;gap:6px}
.opts button{flex:1;padding:8px 0}
.opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scale{font-size:12px;color:var(--mute);margin:4px 0 12px}
.nav{display:flex;gap:8px;margin-top:10px}
.nav button{flex:1}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:13px}
.hint{font-size:12px;color:var(--mute);margin-top:12px}
/* map */
#mapscroll{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#map{position:relative;flex:none}
.tools{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.tools label{display:flex;align-items:center;gap:8px}
.tools input{width:120px}
.tools output{min-width:34px;color:var(--mute)}
.gl{position:absolute;background:var(--line)}
.gl.zero{background:var(--ink);opacity:.5}
.lb{position:absolute;font-size:12px;color:var(--mute);white-space:nowrap}
.th{position:absolute;object-fit:contain;border-radius:3px;border:3px solid;cursor:pointer;background:#ddd}
.th:hover{z-index:5;transform:scale(1.8)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 2px;font-size:13px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}

/* table options */
.table-options{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.table-options label{display:flex;align-items:center;gap:7px}
.table-options select,.table-options input{font:inherit;padding:5px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink)}
.table-quality{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:13px}.table-quality label{display:flex;align-items:center;gap:7px}.table-quality input[type="range"]{width:150px}.table-quality output{min-width:38px;color:var(--mute)}
.table-options .sp{flex:1}
.table-options button{white-space:nowrap}
.table-cell-more{display:block;margin-top:8px;font-size:12px}
.table-cell-more button{padding:3px 8px;font-size:12px}
.table-collapsed .hair-item:nth-child(n+5){display:none}
.table-empty-note{font-size:12px;color:var(--mute);margin:8px 2px}
.table-export-note{font-size:12px;color:var(--mute)}
/* table */
.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.hair-table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
.hair-table th,.hair-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;vertical-align:top}
.hair-table thead th{position:sticky;top:0;background:#f7f8fa;z-index:2;text-align:center;font-size:13px}
.hair-table th:first-child{position:sticky;left:0;z-index:3;text-align:left;min-width:190px;width:190px}
.hair-table tbody th{position:sticky;left:0;background:#f7f8fa;z-index:1;font-size:13px}
.hair-table td{min-width:135px;width:20%}
.hair-cell{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
.hair-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;max-width:100%;font-size:11px;color:var(--mute);text-align:center}
.hair-item img{display:block;width:76px;height:76px;object-fit:contain;border-radius:6px;background:#f0f1f3;cursor:pointer}
.hair-item img:hover{outline:2px solid var(--ink)}
.hair-empty{color:#a0a6af;font-size:12px}
.table-intro{color:var(--mute);font-size:13px;margin:0 0 10px}
.table-count{font-weight:500;color:var(--mute);display:block;margin-top:3px;font-size:11px}

/* 3d */
#cube{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:grab}
#cube.drag{cursor:grabbing}
.tools input[type=checkbox]{width:auto}
.tools select{font:inherit;padding:4px;border:1px solid var(--line);border-radius:6px;background:#fff}
/* families */
.fam{background:var(--panel);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:14px;margin-bottom:16px}
.fam h2{font-size:16px;margin:0 0 2px}
.fam p{margin:0 0 10px;color:var(--mute);font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid img{width:110px;height:110px;object-fit:contain;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Hair length map</h1>
  <div class="tabs">
    <button data-v="rate">Rate</button><button data-v="table">Table</button><button data-v="cube">3D</button><button data-v="map">Graph</button><button data-v="fam">Families</button>
  </div>
  <button id="addImg">Add images</button>
  <button id="addDir">Add folder</button>
  <span class="sp"></span>
  <span id="stat"></span>
  <button id="expJson">Save ratings</button>
  <button id="expDir">Sort into folders</button>
</header>
<input type="file" id="fi" accept="image/*" multiple hidden>
<input type="file" id="fd" webkitdirectory hidden>
<main id="app"></main>

<script>
const REG = ['Top', 'Sides', 'Back'];
const LEVELS = ['Buzzed / skin', 'Short', 'Medium', 'Long', 'Very long'];
const FAM = {
  uniform:  {n: 'Uniform length',                  d: 'Top, sides and back are about the same.',                     slug: 'uniform',                     c: 'var(--uniform)'},
  undercut: {n: 'Longer top, shorter sides',       d: 'Undercuts, fades, quiffs and crops.',                         slug: 'longer-top-shorter-sides',    c: 'var(--undercut)'},
  mullet:   {n: 'Longer back',                     d: 'The back is longer than the sides and the top.',              slug: 'longer-back',                 c: 'var(--mullet)'},
  hybrid:   {n: 'Long top and back, short sides',  d: 'Sides are short while top and back both carry length.',       slug: 'long-top-and-back-short-sides', c: 'var(--hybrid)'}
};
let items = [], cur = 0, reg = 0, view = 'rate';
const $ = (s) => document.querySelector(s);
const key = (f) => 'hairmap:' + f.name + ':' + f.size;
const done = (it) => it.r && it.r.every(Boolean);
const avg = (r) => (r[0] + r[1] + r[2]) / 3;
const code = (r) => r.join('-');
function family(r) {
  const [t, s, b] = r;
  if (b - s >= 1 && b > t) return 'mullet';
  if (b - s >= 1 && t - s >= 1) return 'hybrid';
  if (t - s >= 1) return 'undercut';
  return 'uniform';
}
function save(it) { try { localStorage.setItem(key(it.file), JSON.stringify(it.r)); } catch (e) {} }

function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith('image/')) continue;
    if (items.some((i) => i.file.name === f.name && i.file.size === f.size)) continue;
    let r = null;
    try { r = JSON.parse(localStorage.getItem(key(f)) || 'null'); } catch (e) {}
    items.push({file: f, url: URL.createObjectURL(f), r});
  }
  items.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, {numeric: true}));
  // open on the first unrated image
  const first = items.findIndex((i) => !done(i));
  cur = first < 0 ? 0 : first; reg = 0;
  render();
}

function setVal(v) {
  const it = items[cur];
  it.r = it.r || [null, null, null];
  it.r[reg] = v; save(it);
  if (reg < 2) reg++;
  else if (done(it)) { if (cur < items.length - 1) cur++; reg = 0; }
  render();
}
function go(d) { cur = Math.max(0, Math.min(items.length - 1, cur + d)); reg = 0; render(); }

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === view));
  const n = items.filter(done).length;
  $('#stat').textContent = items.length ? n + ' of ' + items.length + ' rated' : '';
  const app = $('#app');
  if (!items.length) {
    app.innerHTML = '<div class="empty"><p>Add the images you downloaded from Pinterest to start rating.<br>Your ratings are saved in this browser, so you can stop and come back.</p></div>';
    return;
  }
  if (view === 'rate') rateView(app);
  else if (view === 'table') tableView(app);
  else if (view === 'cube') cubeView(app);
  else if (view === 'map') mapView(app);
  else famView(app);
}

function rateView(app) {
  const it = items[cur], r = it.r || [null, null, null];
  const rows = REG.map((name, i) => '<div class="row' + (i === reg ? ' act' : '') + '"><b>' + name + '</b><div class="opts">' +
    [1, 2, 3, 4, 5].map((v) => '<button data-r="' + i + '" data-v="' + v + '" title="' + LEVELS[v - 1] + '" class="' + (r[i] === v ? 'on' : '') + '">' + v + '</button>').join('') +
    '</div></div>').join('');
  const fam = done(it) ? family(r) : null;
  app.innerHTML = '<div class="rate"><div class="stage"><img src="' + it.url + '" alt=""></div><div class="ctl">' +
    '<div style="margin-bottom:10px;color:var(--mute)">Image ' + (cur + 1) + ' of ' + items.length + '</div>' + rows +
    '<div class="scale">1 buzzed, 2 short, 3 medium, 4 long, 5 very long</div>' +
    (fam ? '<span class="chip" style="background:' + FAM[fam].c + '">' + FAM[fam].n + '</span> <span style="color:var(--mute)">' + code(r) + ' (top-sides-back)</span>' : '<span style="color:var(--mute)">Rate all three to place this image.</span>') +
    '<div class="nav"><button id="prev">Previous</button><button id="next">Next</button></div>' +
    '<div class="hint">Keys: T, S, B choose a region. 1 to 5 set it and move on. Left and right arrows change image.</div></div></div>';
  app.querySelectorAll('.opts button').forEach((b) => b.onclick = () => { reg = +b.dataset.r; setVal(+b.dataset.v); });
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
}

function legend() {
  return '<div class="legend">' + Object.values(FAM).map((f) => '<span><i style="background:' + f.c + '"></i>' + f.n + '</span>').join('') + '</div>';
}

let MS = {size: 56, gap: 4, w: 100, h: 680};
try { Object.assign(MS, JSON.parse(localStorage.getItem('hairmap:settings') || '{}')); } catch (e) {}
let LAST = null;

function computeLayout(W, H, S, gap) {
  const L = 60, R = W - 40, T = 30, B = H - 50, YMIN = -4, YMAX = 4, step = S + gap;
  const px = (a) => L + (a - 1) / 4 * (R - L);
  const py = (c) => B - (c - YMIN) / (YMAX - YMIN) * (B - T);
  const longest = (r) => Math.max(...r);
  const topMinusSides = (r) => r[0] - r[1];
  const placed = [], pts = []; let fail = 0;
  items.filter(done).sort((a, b) => longest(a.r) - longest(b.r) || topMinusSides(a.r) - topMinusSides(b.r)).forEach((it) => {
    const bx = px(longest(it.r)), by = py(topMinusSides(it.r));
    let pos = null;
    for (let k = 0; k < 2500 && !pos; k++) {
      const a = k * 2.4, rad = Math.sqrt(k) * step * 0.6;
      const x = bx + Math.cos(a) * rad, y = by + Math.sin(a) * rad;
      if (x < S / 2 || x > W - S / 2 || y < S / 2 || y > H - S / 2 - 30) continue;
      if (placed.every((p) => Math.abs(p[0] - x) >= step || Math.abs(p[1] - y) >= step)) pos = [x, y];
    }
    if (!pos) { fail++; pos = [Math.max(S / 2, Math.min(W - S / 2, bx)), Math.max(S / 2, Math.min(H - S / 2 - 30, by))]; }
    placed.push(pos); pts.push({it, x: pos[0], y: pos[1]});
  });
  return {W, H, L, R, T, B, YMIN, YMAX, px, py, pts, fail, S};
}

function drawMap() {
  const el = $('#map'), wrap = $('#mapscroll');
  const W = Math.round(wrap.clientWidth * MS.w / 100), H = MS.h;
  const g = computeLayout(W, H, MS.size, MS.gap); LAST = g;
  el.style.width = W + 'px'; el.style.height = H + 'px';
  let h = '';
  [1, 2, 3, 4, 5].forEach((v) => {
    h += '<div class="gl" style="left:' + g.px(v) + 'px;top:' + g.T + 'px;width:1px;height:' + (g.B - g.T) + 'px"></div><div class="lb" style="left:' + (g.px(v) - 30) + 'px;top:' + (g.B + 8) + 'px;width:60px;text-align:center">' + LEVELS[v - 1] + '</div>';
  });
  for (let c = g.YMIN; c <= g.YMAX; c++) {
    h += '<div class="gl' + (c === 0 ? ' zero' : '') + '" style="top:' + g.py(c) + 'px;left:' + g.L + 'px;height:1px;width:' + (g.R - g.L) + 'px"></div>';
  }
  h += '<div class="lb" style="left:8px;top:' + (g.py(0) - 9) + 'px">top = sides</div>';
  h += '<div class="lb" style="left:8px;top:' + (g.py(3) - 9) + 'px;width:50px;white-space:normal">top longer</div>';
  h += '<div class="lb" style="left:8px;top:' + (g.py(-3) - 9) + 'px;width:50px;white-space:normal">sides longer</div>';
  h += '<div class="lb" style="left:' + (W / 2 - 130) + 'px;top:' + (H - 22) + 'px">Longest hair length (top, sides, or back)</div>';
  el.innerHTML = h;
  g.pts.forEach(({it, x, y}) => {
    const im = document.createElement('img');
    im.className = 'th'; im.src = it.url; im.title = code(it.r);
    im.style.cssText = 'width:' + g.S + 'px;height:' + g.S + 'px;left:' + (x - g.S / 2) + 'px;top:' + (y - g.S / 2) + 'px;border-color:' + FAM[family(it.r)].c;
    im.onclick = () => { cur = items.indexOf(it); reg = 0; view = 'rate'; render(); };
    el.appendChild(im);
  });
  $('#mapnote').textContent = g.fail ? g.fail + ' images could not be separated. Reduce image size or gap, or make the map wider or taller.' : '';
}


function tableRow(r) {
  const max = Math.max(...r);
  const top = r[0] === max, sides = r[1] === max, back = r[2] === max;
  if (top && sides && back) return 'uniform';
  if (top && back && !sides) return 'topback';
  if (top && !sides && !back) return 'top';
  if (back && !top && !sides) return 'back';
  return 'other';
}

let tableSortDirection = 'asc';
let tableCollapsed = true;
let tableJpgQuality = 90;
let tablePngScale = 1.5;
const TABLE_MAX_VISIBLE_ROWS = 4;

function tableRow(r) {
  const max = Math.max(...r);
  const top = r[0] === max, sides = r[1] === max, back = r[2] === max;
  if (top && sides && back) return 'uniform';
  if (top && back && !sides) return 'topback';
  if (top && !sides && !back) return 'top';
  if (back && !top && !sides) return 'back';
  return 'other';
}

function tableView(app) {
  const rows = [
    {id: 'topback', label: 'Top & back longest', detail: 'Top and back share the highest rating; sides are shorter.'},
    {id: 'uniform', label: 'All the same', detail: 'Top, sides and back share the highest rating.'},
    {id: 'top', label: 'Top longest', detail: 'Top has the highest rating on its own.'},
    {id: 'back', label: 'Back longest', detail: 'Back has the highest rating on its own.'},
    {id: 'other', label: 'Other / mixed', detail: 'Includes styles where sides are longest or the maximum is shared by another combination.'}
  ];
  const rated = items.filter(done);
  const unrated = items.length - rated.length;
  const byRow = {};
  rows.forEach(row => byRow[row.id] = []);
  rated.forEach(it => byRow[tableRow(it.r)].push(it));

  // Sort each category by average, then by rating code and filename for stable ties.
  Object.values(byRow).forEach(list => list.sort((a, b) => {
    const delta = avg(a.r) - avg(b.r);
    const primary = tableSortDirection === 'asc' ? delta : -delta;
    return primary || code(a.r).localeCompare(code(b.r), undefined, {numeric: true}) ||
      a.file.name.localeCompare(b.file.name, undefined, {numeric: true});
  }));

  const headings = LEVELS.map((label, idx) =>
    '<th scope="col">' + (idx + 1) + ' · ' + label + '</th>'
  ).join('');
  const body = rows.map(row => {
    const cells = LEVELS.map((_, idx) => {
      const list = byRow[row.id].filter(it => Math.max(...it.r) === idx + 1);
      if (!list.length) return '<td><span class="hair-empty">—</span></td>';
      const cellId = 'cell_' + row.id + '_' + (idx + 1);
      const images = list.map(it => {
        const index = items.indexOf(it);
        return '<div class="hair-item"><img src="' + it.url + '" alt="" data-i="' + index +
          '" title="' + it.file.name.replace(/&/g, '&amp;').replace(/"/g, '&quot;') +
          ' · Top/Sides/Back: ' + code(it.r) + ' · Average: ' + avg(it.r).toFixed(2) +
          '"><span>Avg ' + avg(it.r).toFixed(2) + '</span></div>';
      }).join('');
      const extra = list.length > TABLE_MAX_VISIBLE_ROWS
        ? '<div class="table-cell-more"><button type="button" data-expand="' + cellId + '">' +
          (tableCollapsed ? 'Show all (' + list.length + ')' : 'Show first 4') + '</button></div>'
        : '';
      return '<td><div class="hair-cell ' + (tableCollapsed && list.length > TABLE_MAX_VISIBLE_ROWS ? 'table-collapsed' : '') +
        '" id="' + cellId + '">' + images + '</div>' + extra + '</td>';
    }).join('');
    return '<tr><th scope="row">' + row.label + '<span class="table-count">' +
      byRow[row.id].length + ' image' + (byRow[row.id].length === 1 ? '' : 's') +
      '</span><span class="table-count" style="font-weight:400">' + row.detail +
      '</span></th>' + cells + '</tr>';
  }).join('');

  app.innerHTML = '<p class="table-intro">Columns show the longest rated section (maximum of top, sides and back). Rows show which section or sections reach that maximum. Images in each cell are sorted by average rating. Click a thumbnail to edit its ratings.</p>' +
    '<div class="table-options">' +
    '<label>Average sort <select id="tableSort"><option value="asc"' + (tableSortDirection === 'asc' ? ' selected' : '') + '>Ascending (lowest first)</option><option value="desc"' + (tableSortDirection === 'desc' ? ' selected' : '') + '>Descending (highest first)</option></select></label>' +
    '<label><input type="checkbox" id="tableCollapse"' + (tableCollapsed ? ' checked' : '') + '> Collapse large cells to 4 images</label>' +
    '<span class="sp"></span><button id="exportTableCsv">Export table (CSV)</button><button id="exportTableHtml">Export table (HTML)</button><button id="exportTablePng">Export table (PNG)</button><button id="exportTableJpg">Export table (JPG)</button></div>' +
    '<div class="table-quality"><strong>Image export quality</strong>' +
    '<label>JPG quality <input id="tableJpgQuality" type="range" min="30" max="100" step="5" value="' + tableJpgQuality + '"><output id="tableJpgQualityValue">' + tableJpgQuality + '%</output></label>' +
    '<label>PNG scale <select id="tablePngScale"><option value="1"' + (tablePngScale === 1 ? ' selected' : '') + '>1× · smaller file</option><option value="1.5"' + (tablePngScale === 1.5 ? ' selected' : '') + '>1.5× · balanced</option><option value="2"' + (tablePngScale === 2 ? ' selected' : '') + '>2× · sharper</option></select></label>' +
    '<span class="table-export-note">JPG quality controls compression; PNG scale controls pixel resolution.</span></div>' +
    '<div class="table-wrap"><table class="hair-table"><thead><tr><th scope="col">Style group</th>' +
    headings + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<p class="table-export-note">CSV exports the complete table data. HTML exports a standalone report with embedded thumbnails. PNG and JPG export the full table as a single image, including every rated hairstyle regardless of cell collapse settings.</p>' +
    (unrated ? '<p class="hint">' + unrated + ' unrated image' + (unrated === 1 ? '' : 's') + ' not shown yet. Rate all three sections to place an image in the table.</p>' : '') +
    (!rated.length ? '<p class="hint">Rate at least one image to populate the table.</p>' : '');

  app.querySelectorAll('.hair-item img').forEach(im => im.onclick = () => {
    cur = +im.dataset.i; reg = 0; view = 'rate'; render();
  });
  $('#tableSort').onchange = (e) => { tableSortDirection = e.target.value; tableView($('#app')); };
  $('#tableCollapse').onchange = (e) => { tableCollapsed = e.target.checked; tableView($('#app')); };
  app.querySelectorAll('[data-expand]').forEach(btn => btn.onclick = () => {
    const cell = document.getElementById(btn.dataset.expand);
    if (!cell) return;
    const collapsed = cell.classList.toggle('table-collapsed');

function tableData() {
  const rows = [
    {id: 'topback', label: 'Top & back longest'},
    {id: 'uniform', label: 'All the same'},
    {id: 'top', label: 'Top longest'},
    {id: 'back', label: 'Back longest'},
    {id: 'other', label: 'Other / mixed'}
  ];
  const data = [];
  items.filter(done).forEach(it => {
    const max = Math.max(...it.r);
    data.push({
      file: it.file.name,
      row: rows.find(r => r.id === tableRow(it.r)).label,
      longestRating: max,
      longestLabel: LEVELS[max - 1],
      top: it.r[0], sides: it.r[1], back: it.r[2],
      average: avg(it.r),
      averageDisplay: avg(it.r).toFixed(2),
      url: it.url,
      item: it
    });
  });
  data.sort((a, b) => {
    const d = a.average - b.average;
    return (tableSortDirection === 'asc' ? d : -d) ||
      a.file.localeCompare(b.file, undefined, {numeric: true});
  });
  return {rows, data};
}

function csvEscape(value) {
  const s = String(value ?? '');
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportTableCSV() {
  const {data} = tableData();
  const headers = ['Filename', 'Style group', 'Longest rating', 'Longest rating label', 'Top rating', 'Sides rating', 'Back rating', 'Average rating'];
  const lines = [headers.map(csvEscape).join(',')];
  data.forEach(d => lines.push([
    d.file, d.row, d.longestRating, d.longestLabel, d.top, d.sides, d.back, d.averageDisplay
  ].map(csvEscape).join(',')));
  download('hair-length-table.csv', '\ufeff' + lines.join('\r\n'));
}


async function exportTableImage(format) {
  const {rows, data} = tableData();
  if (!data.length) return alert('Rate some images first.');
  const byCell = {};
  rows.forEach(r => byCell[r.id] = {});
  data.forEach(d => {
    const rowId = tableRow(d.item.r);
    (byCell[rowId][d.longestRating] ||= []).push(d);
  });

  // Draw the complete table, independent of the current on-screen collapse state.
  const exportScale = format === 'png' ? tablePngScale : 1;
  const baseWidth = 1740;
  const labelW = 260;
  const width = Math.round(baseWidth * exportScale);
  const colW = (baseWidth - labelW) / 5;
  const pad = 12;
  const thumb = 72;
  const captionH = 32;
  const itemW = 86;
  const perLine = Math.max(1, Math.floor((colW - pad * 2) / itemW));
  const headerH = 70;
  const rowHeights = rows.map(r => {
    let lines = 1;
    LEVELS.forEach((_, i) => {
      const count = (byCell[r.id][i + 1] || []).length;
      lines = Math.max(lines, Math.ceil(count / perLine));
    });
    return Math.max(95, 22 + lines * (thumb + captionH + 8));
  });
  const baseHeight = headerH + rowHeights.reduce((a, b) => a + b, 0);
  const totalHeight = Math.round(baseHeight * exportScale);
  if (width > 16000 || totalHeight > 16000 || width * totalHeight > 100000000) {
    return alert('This table is too large for a single image at this quality setting. Try a lower PNG scale or use the HTML/CSV export.');
  }

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = totalHeight;
  const ctx = canvas.getContext('2d');
  if (!ctx) return alert('Could not create the export image in this browser.');
  ctx.scale(exportScale, exportScale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, totalHeight);
  ctx.fillStyle = '#1d2430';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('Hair length table', pad, 24);
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = '#68707d';
  ctx.fillText('Sorted ' + (tableSortDirection === 'asc' ? 'ascending (lowest average first)' : 'descending (highest average first)') +
    ' · Average = mean of top, sides and back ratings', pad, 49);

  // Header cells.
  ctx.fillStyle = '#f0f2f5';
  ctx.fillRect(0, headerH - 1, width, 1);
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#1d2430';
  ctx.textAlign = 'left';
  ctx.fillText('Style group', pad, headerH / 2 + 8);
  LEVELS.forEach((label, i) => {
    const x = labelW + i * colW;
    ctx.fillText((i + 1) + ' · ' + label, x + pad, headerH / 2 + 8);
  });

  // Load images once, tolerating individual failures.
  const imageMap = new Map();
  await Promise.all(data.map(async d => {
    try { imageMap.set(d.file, await loadImg(d.url)); } catch (e) {}
  }));

  let y = headerH;
  rows.forEach((row, rowIndex) => {
    const rowH = rowHeights[rowIndex];
    ctx.fillStyle = rowIndex % 2 ? '#ffffff' : '#fafbfc';
    ctx.fillRect(0, y, width, rowH);
    ctx.strokeStyle = '#d5d9df';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y + rowH);
    ctx.lineTo(width, y + rowH);
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#1d2430';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText(row.label, pad, y + 12, labelW - pad * 2);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#68707d';
    const rowCount = data.filter(d => tableRow(d.item.r) === row.id).length;
    ctx.fillText(rowCount + ' image' + (rowCount === 1 ? '' : 's'), pad, y + 34);

    LEVELS.forEach((_, colIndex) => {
      const x = labelW + colIndex * colW;
      ctx.strokeStyle = '#d5d9df';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + rowH);
      ctx.stroke();
      const list = byCell[row.id][colIndex + 1] || [];
      if (!list.length) {
        ctx.fillStyle = '#a0a6af';
        ctx.font = '12px system-ui, sans-serif';
        ctx.fillText('—', x + pad, y + 14);
        return;
      }
      list.forEach((d, index) => {
        const line = Math.floor(index / perLine);
        const slot = index % perLine;
        const ix = x + pad + slot * itemW;
        const iy = y + 10 + line * (thumb + captionH + 8);
        const im = imageMap.get(d.file);
        if (im) {
          const scale = Math.min(thumb / im.naturalWidth, thumb / im.naturalHeight);
          const iw = im.naturalWidth * scale;
          const ih = im.naturalHeight * scale;
          ctx.fillStyle = '#f0f1f3';
          ctx.fillRect(ix, iy, thumb, thumb);
          ctx.drawImage(im, ix + (thumb - iw) / 2, iy + (thumb - ih) / 2, iw, ih);
        }
        ctx.fillStyle = '#68707d';
        ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('Avg ' + d.averageDisplay, ix + thumb / 2, iy + thumb + 3);
        ctx.fillText(d.top + '/' + d.sides + '/' + d.back, ix + thumb / 2, iy + thumb + 16);
        ctx.textAlign = 'left';
      });
    });
    y += rowH;
  });
  // Vertical table borders.
  ctx.strokeStyle = '#d5d9df';
  ctx.beginPath();
  ctx.moveTo(0, headerH);
  ctx.lineTo(0, totalHeight);
  ctx.moveTo(labelW, headerH);
  ctx.lineTo(labelW, totalHeight);
  for (let i = 1; i <= 5; i++) {
    const x = labelW + i * colW;
    ctx.moveTo(x, headerH);
    ctx.lineTo(x, totalHeight);
  }
  ctx.stroke();

  const mime = format === 'png' ? 'image/png' : 'image/jpeg';
  const ext = format === 'png' ? 'png' : 'jpg';
  canvas.toBlob(blob => {
    if (!blob) return alert('The browser could not create this image. Try the PNG export or HTML export instead.');
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = 'hair-length-table.' + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }, mime, format === 'png' ? undefined : tableJpgQuality / 100);
}

async function exportMap() {
  if (!LAST || !LAST.pts.length) return alert('Rate some images first.');
  const g = LAST, sc = 2, LG = 44, cs = getComputedStyle(document.documentElement);
  const col = (k) => cs.getPropertyValue('--' + k).trim();
  const cv = document.createElement('canvas');
  cv.width = g.W * sc; cv.height = (g.H + LG) * sc;
  const c = cv.getContext('2d');
  c.scale(sc, sc);
  c.fillStyle = '#fff'; c.fillRect(0, 0, g.W, g.H + LG);
  c.font = '13px system-ui, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  let lx = 16;
  Object.keys(FAM).forEach((k) => {
    c.fillStyle = col(k); c.fillRect(lx, LG / 2 - 6, 12, 12);
    c.fillStyle = '#1d2430'; c.fillText(FAM[k].n, lx + 18, LG / 2);
    lx += 18 + c.measureText(FAM[k].n).width + 24;
  });
  c.translate(0, LG);
  c.lineWidth = 1; c.font = '12px system-ui, sans-serif'; c.textBaseline = 'top';
  [1, 2, 3, 4, 5].forEach((v) => {
    const x = g.px(v);
    c.strokeStyle = '#d5d9df'; c.beginPath(); c.moveTo(x, g.T); c.lineTo(x, g.B); c.stroke();
    c.fillStyle = '#68707d'; c.textAlign = 'center'; c.fillText(LEVELS[v - 1], x, g.B + 8);
  });
  for (let v = g.YMIN; v <= g.YMAX; v++) {
    const y = g.py(v);
    c.strokeStyle = v === 0 ? 'rgba(29,36,48,.5)' : '#d5d9df';
    c.beginPath(); c.moveTo(g.L, y); c.lineTo(g.R, y); c.stroke();
  }
  c.fillStyle = '#68707d'; c.textAlign = 'left';
  c.fillText('top = sides', 8, g.py(0) - 9);
  c.fillText('top longer', 8, g.py(3) - 9);
  c.fillText('sides longer', 8, g.py(-3) - 9);
  c.textAlign = 'center'; c.fillText('Longest hair length (top, sides, or back)', g.W / 2, g.H - 22);
  const imgs = await Promise.all(g.pts.map((p) => loadImg(p.it.url)));
  g.pts.forEach((p, i) => {
    const S = g.S;
    const x = p.x - S / 2;
    const y = p.y - S / 2;
    const im = imgs[i];

    // Draw the coloured square background
    c.fillStyle = col(family(p.it.r));
    c.fillRect(x, y, S, S);

    // Fit the entire image inside the square without cropping
    const pad = 3;
    const box = S - pad * 2;
    const scale = Math.min(
      box / im.naturalWidth,
      box / im.naturalHeight
    );

    const dw = im.naturalWidth * scale;
    const dh = im.naturalHeight * scale;
    const dx = x + (S - dw) / 2;
    const dy = y + (S - dh) / 2;

    c.drawImage(im, dx, dy, dw, dh);
  });
  cv.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'hair-length-map.png'; a.click();
  }, 'image/png');
}

/* ---------- 3D cube view: every Top / Sides / Back permutation, origin = 1-1-1 ---------- */
const CS_DEFAULT = {yaw: 0.6, pitch: 0.4, zoom: 100, size: 52, spread: 100, persp: 35, lattice: true, codes: true, auto: false, h: 720, mode: 'orbit', cam: [0, 0, 6], wyaw: 0, wpitch: 0};
let CS = Object.assign({}, CS_DEFAULT, {cam: [0, 0, 6]});
try { Object.assign(CS, JSON.parse(localStorage.getItem('hairmap:cube') || '{}')); } catch (e) {}
let cubeDirty = true, cubeHits = [], cubeHover = null, cubeEl = null, cubeRAF = 0, cubeSize = '';
const CUBE_OFFS = (() => {
  const o = [];
  for (const a of [-1, 0, 1]) for (const b of [-1, 0, 1]) for (const c of [-1, 0, 1]) o.push([a, b, c]);
  return o.sort((p, q) => (p[0] ** 2 + p[1] ** 2 + p[2] ** 2) - (q[0] ** 2 + q[1] ** 2 + q[2] ** 2));
})();
const cubeSave = () => { try { localStorage.setItem('hairmap:cube', JSON.stringify(CS)); } catch (e) {} };

function cubeImg(it) {
  if (!it._img) {
    const im = new Image();
    it._p = new Promise((res) => { im.onload = () => { it._ok = true; cubeDirty = true; res(); }; im.onerror = res; });
    im.src = it.url; it._img = im;
  }
  return it._img;
}

function cubeProject(p, W, H) {
  if (CS.mode === 'walk') {
    const cy = Math.cos(CS.wyaw), sy = Math.sin(CS.wyaw), cp = Math.cos(CS.wpitch), sp = Math.sin(CS.wpitch);
    const dx = p[0] - CS.cam[0], dy = p[1] - CS.cam[1], dz = p[2] - CS.cam[2];
    const depth = dx * sy * cp + dy * sp - dz * cy * cp;
    const rx = dx * cy + dz * sy, ry = -dx * sy * sp + dy * cp + dz * cy * sp;
    const sc = 0.65 * H * CS.zoom / 100 / Math.max(depth, 0.001);
    return {x: W / 2 + rx * sc, y: H / 2 - ry * sc, z: -depth, k: 1, sc, vis: depth > 0.15};
  }
  const cy = Math.cos(CS.yaw), sy = Math.sin(CS.yaw), cp = Math.cos(CS.pitch), sp = Math.sin(CS.pitch);
  const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
  const y2 = p[1] * cp - z1 * sp, z2 = p[1] * sp + z1 * cp;
  const D = 40 - CS.persp * 0.34, k = D / Math.max(0.5, D - z2);
  const u = Math.min(W, H) / 8.8 * CS.zoom / 100;
  return {x: W / 2 + x1 * u * k, y: H * 0.54 - y2 * u * k, z: z2, k, sc: u * k, vis: true};
}

function drawCube(ctx, W, H, interactive) {
  const css = getComputedStyle(document.documentElement);
  const col = (k) => css.getPropertyValue('--' + k).trim();
  const f = Math.min(W, H) / 680;
  const P = (x, y, z) => cubeProject([x, y, z], W, H);
  const seg = (A, B) => {
    let a = P(...A), b = P(...B);
    if (!a.vis && !b.vis) return;
    if (!a.vis || !b.vis) {
      const da = -a.z, db = -b.z, N = 0.15;
      if (!a.vis) { const t = (N - da) / (db - da); a = P(A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1]), A[2] + t * (B[2] - A[2])); }
      else { const t = (N - db) / (da - db); b = P(B[0] + t * (A[0] - B[0]), B[1] + t * (A[1] - B[1]), B[2] + t * (A[2] - B[2])); }
    }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  };
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  // bounding box
  const lo = -2.5, hi = 2.5, C = [];
  for (const a of [lo, hi]) for (const b of [lo, hi]) for (const c of [lo, hi]) C.push([a, b, c]);
  ctx.strokeStyle = '#e1e4e9'; ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
    const d = (C[i][0] !== C[j][0]) + (C[i][1] !== C[j][1]) + (C[i][2] !== C[j][2]);
    if (d !== 1) continue;
    seg(C[i], C[j]);
  }
  // axes from the 1-1-1 origin
  const AX = [[1, 0, 0, 'Top', '#d1495b'], [0, 1, 0, 'Sides', '#3a7ca5'], [0, 0, 1, 'Back', '#4f8a4b']];
  ctx.font = '600 ' + 12 * f + 'px system-ui, sans-serif';
  AX.forEach(([dx, dy, dz, name, c]) => {
    ctx.strokeStyle = c; ctx.lineWidth = 2.5 * f;
    seg([-2, -2, -2], [-2 + 5 * dx, -2 + 5 * dy, -2 + 5 * dz]);
    for (let v = 1; v <= 5; v++) {
      const t = P(-2 + (v - 1) * dx, -2 + (v - 1) * dy, -2 + (v - 1) * dz);
      if (t.vis) { ctx.fillStyle = c; ctx.fillText(v, t.x + 10 * f, t.y + 14 * f); }
    }
    const lab = P(-2 + 5.5 * dx, -2 + 5.5 * dy, -2 + 5.5 * dz);
    ctx.font = '700 ' + 14 * f + 'px system-ui, sans-serif'; ctx.fillStyle = c;
    if (lab.vis) ctx.fillText(name.toUpperCase(), lab.x, lab.y);
    ctx.font = '600 ' + 12 * f + 'px system-ui, sans-serif';
  });

  // depth-sorted drawables: lattice points and image sprites
  const list = [];
  if (CS.lattice) for (let t = 1; t <= 5; t++) for (let s = 1; s <= 5; s++) for (let b = 1; b <= 5; b++) {
    const pr = P(t - 3, s - 3, b - 3);
    if (pr.vis) list.push({z: pr.z, dot: pr});
  }
  const groups = {};
  items.filter(done).forEach((it) => (groups[code(it.r)] = groups[code(it.r)] || []).push(it));
  Object.values(groups).forEach((arr) => {
    arr.sort((a, b) => a.file.name.localeCompare(b.file.name, undefined, {numeric: true}));
    arr.forEach((it, k) => {
      const o = CUBE_OFFS[k % CUBE_OFFS.length];
      const sc = CS.spread / 100 * 0.33 * (1 + Math.floor(k / CUBE_OFFS.length) * 0.5);
      const pr = P(it.r[0] - 3 + o[0] * sc, it.r[1] - 3 + o[1] * sc, it.r[2] - 3 + o[2] * sc);
      if (pr.vis) list.push({z: pr.z, it, pr});
    });
  });
  list.sort((a, b) => a.z - b.z);
  if (interactive) cubeHits = [];

  const sprite = (it, pr, mult) => {
    const im = cubeImg(it), box = Math.min(CS.size / 77.3 * pr.sc * mult, H * 0.9);
    let w = box, h = box;
    if (it._ok) { const r = im.naturalWidth / im.naturalHeight; if (r > 1) h = box / r; else w = box * r; }
    const x = pr.x - w / 2, y = pr.y - h / 2, b = Math.max(1.5, 2.5 * f * mult);
    ctx.fillStyle = col(family(it.r)); ctx.fillRect(x - b, y - b, w + 2 * b, h + 2 * b);
    if (it._ok) ctx.drawImage(im, x, y, w, h); else { ctx.fillStyle = '#ddd'; ctx.fillRect(x, y, w, h); }
    return {x: x - b, y: y - b, w: w + 2 * b, h: h + 2 * b};
  };

  list.forEach((d) => {
    if (d.dot) {
      ctx.fillStyle = '#b8bec8'; ctx.beginPath(); ctx.arc(d.dot.x, d.dot.y, Math.max(1, Math.min(7, d.dot.sc * 0.026)), 0, 6.2832); ctx.fill();
    } else {
      const r = sprite(d.it, d.pr, 1);
      if (interactive) cubeHits.push({it: d.it, pr: d.pr, ...r});
    }
  });

  if (CS.codes) {
    ctx.font = '600 ' + 10 * f + 'px system-ui, sans-serif';
    Object.entries(groups).forEach(([cd, arr]) => {
      const r = arr[0].r, pr = P(r[0] - 3, r[1] - 3, r[2] - 3);
      if (!pr.vis) return;
      const y = pr.y + pr.sc * 0.62;
      ctx.lineWidth = 3 * f; ctx.strokeStyle = '#fff'; ctx.strokeText(cd, pr.x, y);
      ctx.fillStyle = '#1d2430'; ctx.fillText(cd, pr.x, y);
    });
  }

  {
    const og = P(-2, -2, -2);
    if (og.vis) {
    ctx.font = '700 ' + 12 * f + 'px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.lineWidth = 4 * f; ctx.strokeStyle = '#fff'; ctx.strokeText('origin 1-1-1', og.x - 30 * f, og.y + 26 * f);
    ctx.fillStyle = '#1d2430'; ctx.fillText('origin 1-1-1', og.x - 30 * f, og.y + 26 * f); ctx.textAlign = 'center';
    }
  }

  if (interactive && cubeHover) {
    const h = cubeHits.find((x) => x.it === cubeHover);
    if (h) {
      sprite(cubeHover, h.pr, 1.8);
      const txt = code(cubeHover.r) + '   ' + cubeHover.file.name;
      ctx.font = '600 ' + 12 * f + 'px system-ui, sans-serif';
      const tw = ctx.measureText(txt).width + 16;
      const bx = Math.max(4, Math.min(W - tw - 4, h.pr.x - tw / 2)), by = Math.max(4, h.y - 36 * f);
      ctx.fillStyle = '#1d2430'; ctx.fillRect(bx, by, tw, 24 * f);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(txt, bx + 8, by + 12 * f); ctx.textAlign = 'center';
    }
  }

  // titles and legend
  ctx.textAlign = 'left'; ctx.fillStyle = '#1d2430'; ctx.font = '700 ' + 15 * f + 'px system-ui, sans-serif';
  ctx.fillText('Top × Sides × Back', 16, 22 * f);
  ctx.font = (12 * f) + 'px system-ui, sans-serif'; ctx.fillStyle = '#68707d';
  ctx.fillText('1 buzzed · 2 short · 3 medium · 4 long · 5 very long', 16, 42 * f);
  let lx = 16;
  ctx.font = (12 * f) + 'px system-ui, sans-serif';
  Object.keys(FAM).forEach((k) => {
    ctx.fillStyle = col(k); ctx.fillRect(lx, 59 * f, 11 * f, 11 * f);
    ctx.fillStyle = '#1d2430'; ctx.fillText(FAM[k].n, lx + 17 * f, 65 * f);
    lx += 17 * f + ctx.measureText(FAM[k].n).width + 22 * f;
  });
  if (interactive && CS.mode === 'walk') {
    ctx.fillStyle = '#1d2430'; ctx.font = '600 ' + 12 * f + 'px system-ui, sans-serif';
    ctx.fillText('Walk mode · you are at Top ' + (CS.cam[0] + 3).toFixed(1) + ' · Sides ' + (CS.cam[1] + 3).toFixed(1) + ' · Back ' + (CS.cam[2] + 3).toFixed(1), 16, H - 34 * f);
    ctx.fillStyle = '#68707d'; ctx.font = (12 * f) + 'px system-ui, sans-serif';
    ctx.fillText('W A S D move · Q / E down / up · Shift faster · drag to look · scroll to move forward or back', 16, H - 16 * f);
  }
}

function cubePaint() {
  const cv = cubeEl, w = cv.clientWidth, dpr = window.devicePixelRatio || 1;
  const sig = w + 'x' + CS.h + '@' + dpr;
  if (sig !== cubeSize) { cv.width = Math.round(w * dpr); cv.height = Math.round(CS.h * dpr); cv.style.height = CS.h + 'px'; cubeSize = sig; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCube(ctx, w, CS.h, true);
}

const cubeKeys = new Set();
let cubeT = 0;
const CUBE_KEYS = ['w', 'a', 's', 'd', 'q', 'e', 'shift', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '];
addEventListener('keydown', (e) => {
  if (view !== 'cube' || CS.mode !== 'walk' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (CUBE_KEYS.includes(k)) { cubeKeys.add(k); e.preventDefault(); }
});
addEventListener('keyup', (e) => cubeKeys.delete(e.key.toLowerCase()));
addEventListener('blur', () => cubeKeys.clear());

function cubeForward() {
  const cy = Math.cos(CS.wyaw), sy = Math.sin(CS.wyaw), cp = Math.cos(CS.wpitch), sp = Math.sin(CS.wpitch);
  return {F: [sy * cp, sp, -cy * cp], R: [cy, 0, sy]};
}
function cubeMove(f, r, up) {
  const {F, R} = cubeForward();
  for (let i = 0; i < 3; i++) CS.cam[i] = Math.max(-7, Math.min(7, CS.cam[i] + F[i] * f + R[i] * r + (i === 1 ? up : 0)));
  cubeDirty = true;
}
function cubeStep(now) {
  const dt = Math.min(0.05, (now - cubeT) / 1000 || 0); cubeT = now;
  if (CS.mode !== 'walk' || !cubeKeys.size) return;
  const sp = 2.2 * (cubeKeys.has('shift') ? 3 : 1) * dt, has = (...k) => k.some((x) => cubeKeys.has(x));
  cubeMove(sp * (has('w', 'arrowup') - has('s', 'arrowdown')), sp * (has('d') - has('a')), sp * (has('e', ' ') - has('q')));
  if (has('arrowleft')) CS.wyaw -= 1.6 * dt;
  if (has('arrowright')) CS.wyaw += 1.6 * dt;
  cubeDirty = true;
}

function cubeEnterWalk(centre) {
  if (centre) { CS.cam = [0, 0, 0]; CS.wyaw = -0.785; CS.wpitch = -0.615; }
  else {
    const D = 6, cp = Math.cos(CS.pitch), sp = Math.sin(CS.pitch), cy = Math.cos(CS.yaw), sy = Math.sin(CS.yaw);
    CS.cam = [-D * cp * sy, D * sp, D * cp * cy]; CS.wyaw = CS.yaw; CS.wpitch = -CS.pitch;
  }
  CS.mode = 'walk'; CS.auto = false; cubeSave(); cubeView($('#app'));
}

function cubeLoop(now) {
  cubeStep(now);
  if (view !== 'cube' || !cubeEl || !document.body.contains(cubeEl)) { cubeRAF = 0; return; }
  if (CS.auto) { CS.yaw += 0.006; cubeDirty = true; }
  if (cubeDirty) { cubeDirty = false; cubePaint(); }
  cubeRAF = requestAnimationFrame(cubeLoop);
}

async function exportCube() {
  const rated = items.filter(done);
  if (!rated.length) return alert('Rate some images first.');
  rated.forEach(cubeImg);
  await Promise.all(rated.map((it) => it._p));
  const W = cubeEl.clientWidth, H = CS.h, sc = 2;
  const cv = document.createElement('canvas'); cv.width = W * sc; cv.height = H * sc;
  const ctx = cv.getContext('2d'); ctx.scale(sc, sc);
  drawCube(ctx, W, H, false);
  cv.toBlob((b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'hair-3d-map.png'; a.click(); }, 'image/png');
}

function cubeView(app) {
  const sl = (id, label, min, max, step, unit) => '<label>' + label + '<input type="range" id="c_' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + CS[id] + '"><output>' + CS[id] + unit + '</output></label>';
  const ck = (id, label) => '<label><input type="checkbox" id="c_' + id + '"' + (CS[id] ? ' checked' : '') + '> ' + label + '</label>';
  const unrated = items.length - items.filter(done).length;
  app.innerHTML = '<p class="table-intro">All 125 combinations of Top, Sides and Back (1 to 5 each). The origin is 1-1-1; each axis runs up to 5. Drag to rotate, scroll to zoom, click an image to edit its ratings.</p>' +
    legend() +
    '<div class="tools">' + sl('size', 'Image size', 20, 140, 2, '') + sl('spread', 'Spread in cell', 0, 250, 10, '%') + sl('persp', 'Perspective', 0, 100, 5, '') + sl('zoom', 'Zoom', 40, 300, 5, '%') + sl('h', 'Height', 400, 1000, 20, '') +
    '<label>Mode <select id="c_mode"><option value="orbit">Orbit (outside)</option><option value="walk">Walk (inside)</option></select></label><button id="c_centre">Walk from centre</button>' +
    '<label>View <select id="c_view"><option value="">Choose…</option><option value="iso">Isometric</option><option value="front">Front: Top × Sides</option><option value="side">Side: Back × Sides</option><option value="floor">Floor: Top × Back</option></select></label>' +
    ck('lattice', 'Lattice points') + ck('codes', 'Codes') + ck('auto', 'Auto-rotate') +
    '<button id="c_rst">Reset</button><span class="sp"></span><button id="c_exp">Export 3D map (PNG)</button></div>' +
    '<canvas id="cube"></canvas><p class="hint" id="c_hint"></p>' +
    (unrated ? '<p class="hint">' + unrated + ' unrated image' + (unrated === 1 ? '' : 's') + ' not shown yet.</p>' : '');
  cubeEl = $('#cube'); cubeSize = ''; cubeDirty = true; cubeT = performance.now();
  $('#c_mode').value = CS.mode;
  $('#c_hint').textContent = CS.mode === 'walk'
    ? 'Walk mode: W A S D move, Q / E go down / up, Shift moves faster, arrow keys also work, drag to look around, scroll to move forward or back. Switching to Walk locks the current view as your starting point.'
    : 'Tip: switch Mode to Walk (inside) to lock this view and move through the space.';
  $('#c_mode').onchange = (e) => { if (e.target.value === 'walk') cubeEnterWalk(false); else { CS.mode = 'orbit'; cubeSave(); cubeView($('#app')); } };
  $('#c_centre').onclick = () => cubeEnterWalk(true);
  const units = {size: '', spread: '%', persp: '', zoom: '%', h: ''};
  Object.keys(units).forEach((id) => {
    const inp = $('#c_' + id);
    inp.oninput = () => { CS[id] = +inp.value; inp.nextElementSibling.textContent = inp.value + units[id]; cubeSave(); cubeDirty = true; };
  });
  ['lattice', 'codes', 'auto'].forEach((id) => { $('#c_' + id).onchange = (e) => { CS[id] = e.target.checked; cubeSave(); cubeDirty = true; }; });
  $('#c_view').onchange = (e) => {
    const v = {iso: [0.6, 0.4], front: [0, 0], side: [Math.PI / 2, 0], floor: [0, Math.PI / 2]}[e.target.value];
    if (v) { CS.yaw = v[0]; CS.pitch = v[1]; CS.auto = false; CS.mode = 'orbit'; cubeSave(); cubeView($('#app')); }
  };
  $('#c_rst').onclick = () => { CS = Object.assign({}, CS_DEFAULT, {cam: [0, 0, 6]}); cubeSave(); cubeView($('#app')); };
  $('#c_exp').onclick = exportCube;

  let drag = null, moved = false;
  const hit = (x, y) => { for (let i = cubeHits.length - 1; i >= 0; i--) { const h = cubeHits[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h.it; } return null; };
  cubeEl.onpointerdown = (e) => { drag = {x: e.clientX, y: e.clientY}; moved = false; cubeEl.setPointerCapture(e.pointerId); cubeEl.classList.add('drag'); };
  cubeEl.onpointermove = (e) => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (moved) {
        if (CS.mode === 'walk') { CS.wyaw += dx * 0.005; CS.wpitch = Math.max(-1.5, Math.min(1.5, CS.wpitch - dy * 0.005)); }
        else { CS.yaw += dx * 0.01; CS.pitch = Math.max(-1.5708, Math.min(1.5708, CS.pitch + dy * 0.01)); }
        drag = {x: e.clientX, y: e.clientY}; cubeDirty = true;
      }
    } else {
      const h = hit(e.offsetX, e.offsetY);
      if (h !== cubeHover) { cubeHover = h; cubeEl.style.cursor = h ? 'pointer' : ''; cubeDirty = true; }
    }
  };
  cubeEl.onpointerup = (e) => {
    const was = moved; drag = null; cubeEl.classList.remove('drag'); cubeSave();
    if (!was) { const h = hit(e.offsetX, e.offsetY); if (h) { cur = items.indexOf(h); reg = 0; view = 'rate'; render(); } }
  };
  cubeEl.onpointerleave = () => { if (cubeHover) { cubeHover = null; cubeDirty = true; } };
  cubeEl.onwheel = (e) => {
    e.preventDefault();
    if (CS.mode === 'walk') { cubeMove(-e.deltaY * 0.004, 0, 0); return; }
    CS.zoom = Math.max(40, Math.min(300, Math.round(CS.zoom * Math.exp(-e.deltaY * 0.001))));
    const z = $('#c_zoom'); z.value = CS.zoom; z.nextElementSibling.textContent = CS.zoom + '%';
    cubeSave(); cubeDirty = true;
  };
  if (cubeRAF) cancelAnimationFrame(cubeRAF);
  cubeRAF = requestAnimationFrame(cubeLoop);
}
addEventListener('resize', () => { cubeDirty = true; });

addEventListener('resize', () => { if (view === 'map') render(); });
render();
// first-run buttons
$('#app').addEventListener('click', () => {});
</script>
</body>
</html>
